{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "Our home hubot.",
    "install": {
      "figlet": {
        "pkg-path": "figlet"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      }
    },
    "vars": {
      "NPM_CONFIG_PREFIX": "$FLOX_ENV_CACHE/npm-global"
    },
    "hook": {
      "on-activate": "  mkdir -p \"$NPM_CONFIG_PREFIX\"\n  export PATH=\"$NPM_CONFIG_PREFIX/bin:$PATH\"\n  if find node_modules -maxdepth 1 -type l 2>/dev/null | grep -q .; then\n    echo \"Skipping npm install: linked package(s) detected in node_modules\"\n  else\n    npm install\n  fi\n  if [[ -f \".env\" ]]; then\n      echo \"Loading environment variables ...\"\n      set -a\n      source .env\n      set +a\n  fi\n  figlet -f slant \"Yeargin Hubot\"\n  echo \"\"\n"
    },
    "options": {},
    "build": {
      "yeargin-hubot": {
        "command": "  set -e\n\n  mkdir -p \"$out/lib/yeargin-hubot\" \"$out/bin\"\n\n  cp package.json package-lock.json external-scripts.json \"$out/lib/yeargin-hubot/\"\n  cp -r src/ bin/ scripts/ \"$out/lib/yeargin-hubot/\"\n\n  cd \"$out/lib/yeargin-hubot\"\n  npm install --omit=dev\n\n  cat > \"$out/bin/yeargin-hubot\" << 'WRAPPER'\n#!/usr/bin/env bash\nset -a\nsource .env\nset +a\nSCRIPT_DIR=$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\ncd \"$SCRIPT_DIR/../lib/yeargin-hubot\"\nexec node node_modules/.bin/hubot --adapter @hubot-friends/hubot-slack --alias '!' \"$@\"\nWRAPPER\n  chmod +x \"$out/bin/yeargin-hubot\"\n",
        "version": "1.0.0",
        "description": "yeargin-hubot Slack bot"
      }
    }
  },
